<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jason's Place</title>
<link rel="stylesheet" href="journey.css">
<style>
  :root { --gold:#f0c14b; --ink:#2a1b16; --cream:#fff6e4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#140e0c; color:var(--cream); font-family:Georgia,serif; }
  #house { height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; }
  #room { flex:1; margin:10px; border-radius:22px; background:#123024 center/cover no-repeat; position:relative; overflow:hidden; transition:background-image .55s ease; }
  #room:after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 40%, rgba(12,8,6,.82)); }
  #caption { position:absolute; left:14px; right:14px; bottom:14px; z-index:1; }
  #caption p { margin:0; letter-spacing:.14em; text-transform:uppercase; font:700 11px system-ui; color:var(--gold); }
  #caption h1 { margin:4px 0; font-size:34px; line-height:.95; }
  #doors { display:flex; gap:8px; overflow:auto; padding:0 10px 14px; }
  #doors button, #go { border:0; border-radius:14px; padding:12px; font-family:inherit; font-weight:800; background:#fff6e4; color:var(--ink); }
  #doors button.on { background:var(--gold); }
  #go { display:none; width:calc(100% - 20px); margin:0 10px 12px; background:linear-gradient(#ffe7a0,#f0c14b); }
  #go.on { display:block; }
  .book { background:rgba(255,246,228,.94); color:var(--ink); border-radius:12px; padding:8px; margin-top:8px; }
</style>
</head>
<body>
<div id="house">
  <div id="room">
    <div id="caption"></div>
  </div>
  <div id="doors"></div>
  <button id="go">The Mansion Millions door</button>
</div>
<script>
const ROOMS = [
  { id:"foyer", name:"Foyer", kicker:"You arrive", img:"explore.jpg", line:"The doors close behind you. The house is already walking.", doors:["library","kitchen","garden"] },
  { id:"library", name:"Library", kicker:"Books", img:"album.jpg", line:"Juni counts the shelves. Three books are awake.", doors:["foyer","story","art"], books:["Ellie and the Shadow Guardians","The night the fountain paid","Your child is the star"] },
  { id:"kitchen", name:"Kitchen", kicker:"West wing", img:"build.jpg", line:"Cakes on the counter. A warm tile under the door.", doors:["foyer","music"] },
  { id:"garden", name:"Garden", kicker:"Outside", img:"board.jpg", line:"The path glows. Coins sit in the fountain like they are waiting.", doors:["foyer","music"] },
  { id:"story", name:"Storybook room", kicker:"A page turns", img:"reward.jpg", line:"Jeeves holds the place. The goblet is only a picture here.", doors:["library","vault"] },
  { id:"art", name:"Art room", kicker:"Studio", img:"mansion-bg.jpg", line:"Draw the house before it draws you.", doors:["library"] },
  { id:"music", name:"Music room", kicker:"A tune", img:"explore.jpg", line:"The music box is closed. Lumi lights the hall toward the last door.", doors:["kitchen","garden","vault"] },
  { id:"vault", name:"The far door", kicker:"You found it", img:"board.jpg", line:"This door does not open a room. It opens Mansion Millions.", doors:["story","music"], game:true }
];
let seen = JSON.parse(localStorage.getItem("jp-seen")||"[]");
let cur = "foyer";
const room = document.getElementById("room");
const cap = document.getElementById("caption");
const doors = document.getElementById("doors");
const go = document.getElementById("go");
function show(id){
  const r = ROOMS.find(x=>x.id===id);
  cur = id;
  if(!seen.includes(id)) seen.push(id);
  localStorage.setItem("jp-seen", JSON.stringify(seen));
  room.style.backgroundImage = "url("+r.img+")";
  cap.innerHTML = `<p>${r.kicker} · ${seen.length}/${ROOMS.length} rooms</p><h1>${r.name}</h1><p>${r.line}</p>` +
    (r.books? r.books.map(b=>`<div class="book">${b}</div>`).join("") : "");
  doors.innerHTML = r.doors.map(d=>{
    const n = ROOMS.find(x=>x.id===d);
    return `<button data-go="${d}">${n.name}</button>`;
  }).join("");
  go.classList.toggle("on", !!r.game);
}
doors.onclick = e => { if(e.target.dataset.go) show(e.target.dataset.go); };
go.onclick = () => { if(window.mmJourney) mmJourney("continuous.html","Mansion Millions","The far door opens onto the board.","board.jpg"); else location.href="continuous.html"; };
show("foyer");
</script>
<script src="journey.js"></script>
</body>
</html>
