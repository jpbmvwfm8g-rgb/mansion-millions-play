<style>

@media(max-width:800px){.grid,.choices{grid-template-columns:1fr}.top{flex-wrap:wrap}.hud{display:flex;width:100%;margin:0;justify-content:flex-start}.brand{font-size:clamp(17px,4.8vw,20px)}.clock-row{align-items:flex-start}.clock-row h1{font-size:28px!important;line-height:1.15}.clock{width:72px;height:72px}}

<body>
<div class="sky" id="sky"></div>
<div class="veil" id="veil"></div>
<div class="wrap">
  <header class="top">
    <div class="mark">M</div>
    <div class="brand">Mansion Millions<small>A NIGHT IN THE HOUSE</small></div>
    <div class="hud" id="hud"></div>
  </header>
  <section class="screen on" id="home"></section>
  <section class="screen" id="play"></section>
  <section class="screen" id="vault"></section>
  <section class="screen" id="album"></section>
  <footer><a href="store.html">Game guide</a> · <a href="https://www.jasonsplace.ca">Jason's Place</a><br>Powered by ARQS Software Intelligence Systems 2026.</footer>
</div>
<script src="vendor/peerjs-1.5.4.min.js"></script>
<script>
const KEY="mansion-millions-shared-state-v1";
const CAST=[
  {id:"jason",name:"Jason",icon:"🧭",role:"Director",skill:"Names the door you already tried.",line:"Every door is a maybe. Pick one."},
  {id:"juno",name:"Juno",icon:"🐕",role:"Tracker",skill:"Flashes the trail before it hides.",line:"I found pawprints. Come on."},
  {id:"juni",name:"Juni",icon:"🐱",role:"Puzzle cat",skill:"Tells you the pattern step.",line:"The bookshelf wall is wrong."},
  {id:"sly",name:"Sly",icon:"🐍",role:"Codekeeper",skill:"Gives the first letter of a cipher.",line:"Every map is missing a piece."},
  {id:"ella",name:"Ella",icon:"🦉",role:"Sky keeper",skill:"Lights the star order once.",line:"The stars are early tonight."},
  {id:"lumi",name:"Lumi",icon:"🕯️",role:"Lightkeeper",skill:"Shows the lantern flash first.",line:"A little light, a big secret."}
];
const ROOMS=[
  {id:"foyer",name:"Grand Foyer",need:0,who:"jason",card:"foyer-key",label:"Foyer Key",blurb:"Three doors. One of Jason's lines is the trick."},
  {id:"library",name:"Grand Library",need:1,who:"juni",card:"pattern",label:"Pattern Lock",blurb:"The clock numbers are a rule, not a decoration."},
  {id:"garden",name:"Secret Garden",need:1,who:"juno",card:"paw",label:"Garden Print",blurb:"The trail flashes, then the hedges close."},
  {id:"cellar",name:"Stone Cellar",need:2,who:"sly",card:"moon-key",label:"Cellar Code",blurb:"The brick cipher stepped every letter forward."},
  {id:"observatory",name:"Sky Dome",need:2,who:"ella",card:"constellation",label:"Star Chart",blurb:"Link 2, then 4, then 1. A wrong star resets."},
  {id:"hall",name:"Candle Hall",need:3,who:"lumi",card:"lantern",label:"Never-Out Lantern",blurb:"Remember four flashes, then repeat them."},
  {id:"garage",name:"Midnight Garage",need:3,who:"jason",card:"roadster-key",label:"Roadster Key",blurb:"The map piece fits one slot, if you brought it."},
  {id:"vault",name:"Starter Vault",need:4,who:"lumi",card:"vault-seal",label:"Vault Seal",floor:0,blurb:"Four clues open the wheel. Then the fortune."},
  {id:"gallery",name:"Portrait Gallery",need:0,who:"jason",card:"portrait",label:"Living Portrait",floor:1,blurb:"One painting blinks. The others are only paint."},
  {id:"balcony",name:"Storm Balcony",need:0,who:"ella",card:"storm",label:"Storm Feather",floor:1,blurb:"The wind knocks three times, then once."},
  {id:"belfry",name:"Bell Tower",need:1,who:"lumi",card:"bell",label:"Tower Bell",floor:1,blurb:"Count the chime. It matches the clock."}
];
const CLUES=["foyer-key","pattern","paw","moon-key"];
const ASSETS={studio:{name:"Creator Studio",price:9000,level:1},loft:{name:"City Loft",price:15000,level:1},roadster:{name:"Classic Roadster",price:22000,level:2},lake:{name:"Lake House",price:48000,level:3},apex:{name:"Apex GT",price:65000,level:4},penthouse:{name:"Skyline Penthouse",price:90000,level:5}};
const CARD_IDS=ROOMS.map(r=>r.card).concat("night-seal");
function fresh(){return{v:10,character:null,xp:0,cash:0,starter:false,streak:0,last:"",owned:{},cards:[],perfect:0,notes:[],floor:0,hour:8,minute:12,whisper:"Eight twelve. The house has not noticed you yet.",favor:0,freeMiss:0,room:""}}
function restore(raw){
  const s=fresh();if(!raw||typeof raw!=="object"||Array.isArray(raw))return s;
  for(const [key,max] of Object.entries({xp:99999,cash:100000000,perfect:12,streak:7,favor:1,freeMiss:1})){
    if(Number.isFinite(raw[key])&&raw[key]>=0)s[key]=Math.min(max,Math.floor(raw[key]));
  }
  if(CAST.some(c=>c.id===raw.character))s.character=raw.character;
  if(Array.isArray(raw.cards))s.cards=[...new Set(raw.cards.filter(id=>CARD_IDS.includes(id)))];
  s.starter=s.cards.includes("vault-seal");
  if(raw.owned&&typeof raw.owned==="object")for(const id of Object.keys(ASSETS))if(raw.owned[id])s.owned[id]=1;
  if(typeof raw.last==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(raw.last)&&Number.isFinite(Date.parse(raw.last)))s.last=raw.last;
  if(Number.isInteger(raw.hour)&&raw.hour>=8&&raw.hour<=13)s.hour=raw.hour;
  if(Number.isInteger(raw.minute)&&raw.minute>=0&&raw.minute<60)s.minute=raw.minute;
  s.floor=raw.floor===1&&(s.hour>=12||s.starter)?1:0;
  s.notes=ROOMS.filter(r=>s.cards.includes(r.card)).map(r=>r.label);
  s.whisper=`${(s.hour%12)||12}:${String(s.minute).padStart(2,"0")} ${s.hour<12?"pm":"am"}. ${s.hour>=12?"The upper floor is awake.":"The night's doors."}`;
  if(typeof raw.room==="string")s.room=raw.room.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  return s;
}
function load(){try{return restore(JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return fresh()}}
let S=load(), roomMiss=0, activeRoom="", storageWarning=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!storageWarning){storageWarning=true;toast("Progress is temporary in this browser. Keep this tab open.")}}hud()}
function pick(id){if(!CAST.some(c=>c.id===id))return;S.character=id;save();shareState();home();toast(who().name+" is your companion.")}
function level(){return [0,400,1000,1800,2800,4000].filter(x=>S.xp>=x).length}
function xpNext(){return [100,400,1000,1800,2800,4000,99999][level()]}
function who(){return CAST.find(c=>c.id===S.character)||CAST[0]}
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  const el=document.getElementById(id);el.classList.add("on");
  document.getElementById("sky").classList.toggle("up",!!S.floor);
  window.scrollTo({top:0,behavior:"instant"});
}
let audioOn=false, actx, master, timer;
function music(){
  audioOn=!audioOn;
  if(!audioOn){if(master)master.gain.linearRampToValueAtTime(0,actx.currentTime+.3);toast("Music off");hud();return}
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio){audioOn=false;toast("Music is unavailable in this browser.");hud();return}
  try{if(!actx)actx=new Audio();if(actx.state==="suspended")actx.resume().catch(()=>{audioOn=false;hud()})}catch(e){audioOn=false;hud();return}
  if(!master){master=actx.createGain();master.gain.value=.0001;master.connect(actx.destination)}
  master.gain.cancelScheduledValues(actx.currentTime);
  master.gain.linearRampToValueAtTime(.18,actx.currentTime+1.2);
  if(!timer)loopBed();
  hud();
  toast("Night music on");
}
function tone(freq,when,dur,type,gain){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(gain,when+.08);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.05);
}
function loopBed(){
  const chords=[[196,247,294],[174,220,262],[220,277,330],[164,196,247]];
  let i=0;
  timer=setInterval(()=>{
    if(!audioOn||!actx)return;
    const now=actx.currentTime;
    chords[i%chords.length].forEach(f=>tone(f,now,3.4,"sine",.05));
    tone(chords[i%chords.length][0]*2,now+1.2,1.6,"triangle",.02);
    if(S.floor)tone(523,now+.4,.8,"sine",.015);
    i++;
  },3200);
}
function chime(ok){if(!audioOn||!actx)return;tone(ok?659:196,actx.currentTime,.35,ok?"triangle":"sawtooth",ok?.06:.03)}
function fadeTo(fn){
  const veil=document.getElementById("veil");
  veil.classList.add("on");
  setTimeout(()=>{try{fn()}finally{veil.classList.remove("on")}},window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:480);
}
function clockFace(){
  const h=((S.hour%12)||12), m=S.minute||0;
  const hh=(h%12)*30+m*0.5, mh=m*6;
  return `<div class="clock" aria-label="${h}:${String(m).padStart(2,"0")}"><i style="transform:rotate(${mh}deg)"></i><b style="transform:rotate(${hh}deg)"></b><s>${h}:${String(m).padStart(2,"0")}</s></div>`;
}
function clockLabel(){return `${(S.hour%12)||12}:${String(S.minute).padStart(2,"0")} ${S.hour<12?"pm":"am"}`}
function tick(mins){
  const before=S.hour, total=Math.min(13*60+59,S.hour*60+S.minute+mins), next=Math.floor(total/60);
  S.minute=total%60;
  for(let h=before+1;h<=next;h++){S.hour=h;chimeHour()}
  S.hour=next;S.whisper=`${clockLabel()}. ${HOURS[S.hour]||"The hands keep moving."}`;
}
function chimeHour(){
  if(S.hour===9)S.cash+=400;
  if(S.hour===10)S.favor=(S.favor||0)+1;
  if(S.hour===11)S.freeMiss=1;
  if(audioOn&&actx){for(let i=0;i<Math.min(S.hour,12);i++)tone(523,actx.currentTime+i*.18,.22,"sine",.04)}
  toast(HOURS[S.hour]||"The hour turns.");
}
function hud(){document.getElementById("hud").innerHTML=`<button class="pill" onclick="music()">${audioOn?"Music on":"Music"}</button><span class="pill">${S.floor?"Upper floor":"Ground"} · ${clockLabel()}</span><span class="pill">${who().icon} ${who().name}</span><span class="pill">${S.cards.length}/12 · M$ ${S.cash.toLocaleString()}</span>${S.room?`<button class="pill" onclick="lobby()">House ${S.room}</button>`:""}`}
const HOURS={9:"Nine. A lamp leaves M$400.",10:"Ten. The next locked door leans open.",11:"Eleven. The next miss will not count.",12:"Midnight. The upper floor unlocks.",13:"Past midnight. The tower is awake."};
function grant(id,label){
  if(!CARD_IDS.includes(id))return;
  if(S.cards.includes(id)){toast(label+" is already in the album.");return}
  S.cards.push(id);S.xp+=90;S.cash+=1600;
  const room=ROOMS.find(r=>r.card===id);
  if(room&&who().id===room.who){S.cash+=800;S.xp+=30}
  if(roomMiss===0){S.perfect=(S.perfect||0)+1;S.cash+=500;toast("Perfect room. "+label+" earned.");chime(true)}
  else {toast("Card earned: "+label);chime(true)}
  if(!S.notes.includes(label))S.notes.push(label);
  tick(60);
  shareState();
  save();
}
function miss(btn,hint){if(S.freeMiss){S.freeMiss=0;toast(who().name+" catches it. That miss does not count.");save();return}roomMiss++;tick(7);if(btn)btn.classList.add("bad");chime(false);toast(hint+" The clock jumped seven minutes.");save();shareState()}
function home(){
  activeRoom="";
  show("home");
  document.getElementById("home").innerHTML=`<div class="panel"><div class="ey">JASON'S PLACE · MANSION MILLIONS</div><h1>The house is awake.</h1><p>Choose your companion, then walk in. The clock starts at 8:12 pm. Every new card moves it an hour. Ten opens the next locked door early. Eleven forgives your next miss. Midnight opens the upper floor.</p><div class="row"><button class="btn" onclick="play()">${S.cards.length?"Continue the night":"Walk in"}</button><button class="btn ghost" onclick="music()">Music</button><button class="btn ghost" onclick="lobby()">Play together</button><button class="btn ghost" onclick="claimDaily()">Daily reward</button><button class="btn ghost" onclick="vault()">Vault</button><button class="btn ghost" onclick="album()">Album</button></div><div class="grid">${CAST.map(c=>`<button class="card ${who().id===c.id?"on":""}" aria-pressed="${who().id===c.id}" onclick="pick('${c.id}')"><div style="font-size:28px" aria-hidden="true">${c.icon}</div><h3>${c.name}</h3><p class="muted">${c.role}. ${c.line}<br>${c.skill}</p></button>`).join("")}</div><p class="fine">Mansion Dollars are fictional and have no cash value. Progress stays on this device. Shared rooms show companions only. No chat.</p><details class="fine"><summary>Install on your phone</summary><p>On iPhone or iPad, open this page in Safari, tap Share, then Add to Home Screen. On Android, use your browser's Install app or Add to Home screen option. Solo play works offline after the first full online visit. Play together needs an internet connection.</p></details></div>`;
}
function lobby(){
  activeRoom="";
  show("play");
  const code=S.room||"";
  document.getElementById("play").innerHTML=`<div class="panel"><div class="ey">SHARED HOUSE</div><h1>Play together.</h1><p class="muted">One room code. Two companions. Share the code with someone you know. The host must keep this tab open. Doors and the clock are shared; Mansion Dollars and purchases stay on each device. No names, no chat.</p><div class="row"><input class="txt" id="code" aria-label="Four-letter house code" maxlength="4" placeholder="Code" value="${code}" autocomplete="off" autocapitalize="characters" style="max-width:140px;text-transform:uppercase"><button class="btn" onclick="hostRoom()">Open a house</button><button class="btn ghost" onclick="joinRoom()">Join</button><button class="btn ghost" onclick="play()">Explore the house</button><button class="btn ghost" onclick="home()">Back</button>${roomPeer?`<button class="btn ghost" onclick="leaveRoom()">Leave house</button>`:""}</div><p id="others" class="say" role="status"></p><p class="fine">Play together needs internet and a browser with WebRTC. If your network prevents a connection, the solo game remains available.</p></div>`;
  roomStatus(sharedStatus);
}
function roomCode(){return (document.getElementById("code")?.value||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4)}
function randomCode(){const bytes=crypto.getRandomValues(new Uint8Array(4));return Array.from(bytes,n=>String.fromCharCode(65+n%26)).join("")}
function hostRoom(){const c=roomCode()||randomCode();if(c.length!==4)return toast("Use four letters, or leave the code blank.");S.room=c;save();connectRoom(c,true)}
function joinRoom(){const c=roomCode();if(c.length<4)return toast("Four letters.");S.room=c;save();connectRoom(c,false)}
let link, roomPeer, connectTimer, sharedStatus="No shared house is connected.";
const PEER_PREFIX="mm-night-v3-";
const PEER_CONFIG={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:["turn:eu-0.turn.peerjs.com:3478?transport=tcp","turn:us-0.turn.peerjs.com:3478?transport=tcp","turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]};
function roomStatus(text){sharedStatus=text;const el=document.getElementById("others");if(el)el.textContent=text}
function disconnectRoom(){clearTimeout(connectTimer);if(link){link.close();link=null}if(roomPeer){roomPeer.destroy();roomPeer=null}}
function leaveRoom(){disconnectRoom();S.room="";roomStatus("You left the shared house. Your progress is saved.");save();lobby()}
function connectRoom(code,host){
  disconnectRoom();
  if(!navigator.onLine||typeof Peer!=="function"){roomStatus("Play together is unavailable right now. You can explore solo.");return}
  roomStatus(host?"Opening house "+code+"…":"Looking for house "+code+"…");
  let peer;try{peer=new Peer(host?PEER_PREFIX+code:undefined,{debug:0,config:PEER_CONFIG})}catch(e){roomStatus("The shared house could not open. You can explore solo.");return}
  roomPeer=peer;
  connectTimer=setTimeout(()=>{if(roomPeer===peer&&(!host||!peer.open)&&!link?.open){disconnectRoom();roomStatus("Connection timed out. Check the code and try again, or explore solo.")}},18000);
  peer.on("open",id=>{
    if(roomPeer!==peer)return;
    toast(host?"House "+code+" is open.":"Looking for "+code);
    roomStatus(host?"House "+code+" is open. Share this code and explore while you wait.":"Joining "+code+"…");
    if(host)clearTimeout(connectTimer);
    else bindLink(peer.connect(PEER_PREFIX+code,{reliable:true}),peer);
  });
  peer.on("connection",conn=>{if(roomPeer!==peer||link){conn.close();return}bindLink(conn,peer)});
  peer.on("error",error=>{if(roomPeer!==peer)return;disconnectRoom();roomStatus(error.type==="unavailable-id"?"That house code is in use. Try a different code.":"The shared house did not connect. Check the code and try again, or explore solo.")});
  peer.on("disconnected",()=>{if(roomPeer===peer)roomStatus("The connection to the house service was interrupted. Leave and reopen the house to reconnect.")});
}
function bindLink(conn,peer){
  link=conn;
  conn.on("open",()=>{if(roomPeer!==peer||link!==conn)return;clearTimeout(connectTimer);roomStatus("Connected in house "+S.room+". Explore together.");shareState()});
  conn.on("data",msg=>{
    if(roomPeer!==peer||link!==conn||!msg||typeof msg!=="object"||msg.v!==1)return;
    const companion=CAST.find(c=>c.id===msg.hi);
    if(companion)roomStatus(companion.name+" is in house "+S.room+".");
    let changed=false;
    if(Array.isArray(msg.cards)&&msg.cards.length<=12)for(const id of msg.cards)if(CARD_IDS.includes(id)&&!S.cards.includes(id)){S.cards.push(id);changed=true}
    if(Number.isInteger(msg.hour)&&msg.hour>=8&&msg.hour<=13&&Number.isInteger(msg.minute)&&msg.minute>=0&&msg.minute<60&&msg.hour*60+msg.minute>S.hour*60+S.minute){S.hour=msg.hour;S.minute=msg.minute;changed=true}
    if(S.cards.includes("vault-seal"))S.starter=true;
    if(msg.floor===1&&(S.hour>=12||S.starter)&&S.floor!==1){S.floor=1;changed=true}
    if(changed){S.whisper=clockLabel()+". A companion opened another door.";save();if(!activeRoom&&!document.getElementById("others")&&document.getElementById("play").classList.contains("on"))play()}
  });
  conn.on("close",()=>{if(link===conn){link=null;roomStatus("Your companion left the house. You can keep exploring.")}});
  conn.on("error",()=>{if(link===conn)roomStatus("The shared connection was interrupted. Leave and reopen the house to reconnect.")});
}
function shareState(){if(link?.open)try{link.send({v:1,hi:who().id,cards:S.cards,hour:S.hour,minute:S.minute,floor:S.floor})}catch(e){roomStatus("The shared connection was interrupted. You can keep exploring.")}}
function play(){
  activeRoom="";
  show("play");
  const floor=S.floor?1:0;
  const list=ROOMS.filter(r=>(r.floor||0)===floor);
  const up=S.hour>=12||S.cards.includes("vault-seal");
  document.getElementById("play").innerHTML=`<div class="panel"><div class="clock-row">${clockFace()}<div><div class="ey">${floor?"UPPER FLOOR":"GROUND FLOOR"} · ${who().icon} ${who().name.toUpperCase()}</div><h1 style="font-size:34px">${S.whisper||"The night's doors."}</h1></div></div><div class="row"><button class="btn ghost" onclick="home()">Companions</button><button class="btn ghost" onclick="album()">Album ${S.cards.length}/12</button><button class="btn ghost" onclick="vault()">Vault</button><button class="btn" ${up?"":"disabled"} onclick="climb()">${floor?"Downstairs":"Climb"}</button>${S.cards.includes("vault-seal")?`<button class="btn ghost" onclick="enterRoom('midnight')">After midnight</button>`:""}</div><div class="grid">${list.map(r=>{const open=roomOpen(r);const done=S.cards.includes(r.card);return `<article class="room ${done?"on":""}"><h3>${r.name}</h3><p class="muted">${r.blurb}</p><button class="btn" ${open?"":"disabled"} onclick="enterRoom('${r.id}')">${done?"Replay":open?"Enter":"Later tonight"}</button></article>`}).join("")}</div><div id="stage"></div></div>`;
}
function roomOpen(r){return r.floor===1?(S.hour>=12||S.starter):S.cards.includes(r.card)||S.cards.length+S.favor>=r.need}
function climb(){if(!(S.hour>=12||S.cards.includes("vault-seal")))return toast("The stair waits for midnight.");fadeTo(()=>{S.floor=S.floor?0:1;save();shareState();play()})}
function enterRoom(id){
  const r=ROOMS.find(x=>x.id===id);
  if(id==="midnight"){if(!S.cards.includes("vault-seal"))return toast("Open the starter vault first.")}
  else if(!r||!roomOpen(r))return toast("That door is still locked.");
  if(!document.getElementById("stage")||!document.getElementById("play").classList.contains("on"))play();
  if(r&&!r.floor&&S.cards.length<r.need&&S.favor){S.favor=0;save()}
  activeRoom=id;roomMiss=0;
  document.getElementById("stage").innerHTML=`<div class="scene"><div class="row"><button class="btn ghost" onclick="play()">Back to doors</button></div><div id="box"></div></div>`;
  if(id==="midnight")midnight();else solve(id);
  document.getElementById("stage").scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth",block:"start"});
}
function solve(id){({foyer,library,garden,cellar,observatory,hall,garage,vault:vaultRoom,gallery,balcony,belfry})[id]()}
function foyer(){
  const hint=who().id==="jason"?"Jason: ignore the gold door. Blue is the quiet one.":"Two hints are true. The gold door is the lie.";
  document.getElementById("box").innerHTML=`<h2>Which door keeps the key?</h2><p class="muted">Jason says the red door is warm, the blue door is quiet, and the gold door is a painting.</p><div class="choices"><button class="choice" onclick="grant('foyer-key','Foyer Key');play()">Blue, the quiet door</button><button class="choice" onclick="miss(this,'${hint}')">Gold painting</button><button class="choice" onclick="miss(this,'${hint}')">Red, just because it is warm</button></div>`;
}
function library(){
  const step=3, base=4, ans=base+step*3;
  const hint=who().id==="juni"?"Juni: add 3 each time.":"The gap never changes.";
  document.getElementById("box").innerHTML=`<h2>Juni's clock</h2><div class="cipher">4 · 7 · 10 · ?</div><div class="choices">${[ans,ans+step,ans-1,16].filter((v,i,a)=>a.indexOf(v)===i).map(n=>`<button class="choice" onclick="if(${n}===${ans}){grant('pattern','Pattern Lock');play()}else miss(this,'${hint}')">${n}</button>`).join("")}</div>`;
}
function garden(){
  window._trail=[];
  const hint=who().id==="juno"?"Juno flashes it again: paw, leaf, paw.":"The repeating mark is the paw.";
  document.getElementById("box").innerHTML=`<h2>The trail hides</h2><p class="muted" id="flash">${who().id==="juno"?"Watch: 🐾 · 🌿 · 🐾":"Which mark holds the path?"}</p><div class="choices"><button class="choice" onclick="grant('paw','Garden Print');play()">🐾 paw, leaf, paw</button><button class="choice" onclick="miss(this,'${hint}')">🦴 bone only</button><button class="choice" onclick="miss(this,'${hint}')">🌿 leaf, leaf, leaf</button></div>`;
}
function cellar(){
  const hint=who().id==="sly"?"Sly: first letter is M. The word is the thing above the dome.":"Step each letter back. N becomes M.";
  document.getElementById("box").innerHTML=`<h2>Third brick</h2><div class="cipher">NPPO</div><label for="code" class="fine">Move each letter back one place in the alphabet.</label><input class="txt" id="code" placeholder="Four-letter answer" maxlength="20" autocomplete="off"><div class="row"><button class="btn" onclick="if(document.getElementById('code').value.trim().toUpperCase()==='MOON'){grant('moon-key','Cellar Code');play()}else miss(null,'${hint}')">Break the code</button></div>`;
  document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")document.querySelector("#box .btn").click()});
}
function observatory(){
  window._stars=[];
  document.getElementById("box").innerHTML=`<h2>Link the stars</h2><p id="starNote">${who().id==="ella"?"Ella lights 2, then 4, then 1.":"The slate shows 2, then 4, then 1. Tap the stars in that order."}</p><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star" aria-label="Star ${n}" id="st${n}" onclick="star(${n})">${n}</button>`).join("")}</div>`;
}
function star(n){
  window._stars.push(n);const el=document.getElementById("st"+n);if(el)el.classList.add("on");
  const note=document.getElementById("starNote");if(note)note.textContent=window._stars.join(" → ");
  const want=[2,4,1];
  if(window._stars[window._stars.length-1]!==want[window._stars.length-1]){miss(null,"That star is early. Resetting.");window._stars=[];document.querySelectorAll(".star").forEach(s=>s.classList.remove("on"));return}
  if(window._stars.length===3){grant("constellation","Star Chart");play()}
}
function hall(){
  window._lamps=[];window._show=["L","R","L","M"];
  document.getElementById("box").innerHTML=`<h2>Copy the flash</h2><p id="lampNote">${who().id==="lumi"?"Lumi shows left, right, left, middle.":"The lanterns flare left, right, left, middle. Repeat that order."}</p><div class="lamps"><button class="lamp" onclick="lamp('L')">Left</button><button class="lamp" onclick="lamp('R')">Right</button><button class="lamp" onclick="lamp('M')">Middle</button></div>`;
}
function lamp(ch){
  window._lamps.push(ch);const note=document.getElementById("lampNote");if(note)note.textContent=window._lamps.join(" · ");
  const want=["L","R","L","M"];
  if(window._lamps[window._lamps.length-1]!==want[window._lamps.length-1]){miss(null,"The hall flares left, right, left, middle.");window._lamps=[];return}
  if(window._lamps.length===4){grant("lantern","Never-Out Lantern");play()}
}
function garage(){
  if(!S.cards.includes("moon-key")){document.getElementById("box").innerHTML=`<h2>The map piece is still in the cellar.</h2><p>Break Sly's code before the roadster will take a key.</p>`;return}
  document.getElementById("box").innerHTML=`<h2>Where does the torn corner fit?</h2><div class="choices"><button class="choice" onclick="grant('roadster-key','Roadster Key');play()">Glove box</button><button class="choice" onclick="miss(this,'The torn corner matches the glove box lip.')">Wheel</button><button class="choice" onclick="miss(this,'Not the trunk. Look at the lip of the glove box.')">Trunk</button></div>`;
}
function vaultRoom(){
  const have=CLUES.filter(id=>S.cards.includes(id));
  if(have.length<4){document.getElementById("box").innerHTML=`<h2>The wheel will not turn.</h2><p>It wants four clues. You have ${have.length}: foyer key, pattern lock, garden print, cellar code.</p>`;return}
  if(S.starter){toast("Vault already open. The stair is awake.");play();return}
  S.starter=true;S.cash+=50000;S.xp+=120;grant("vault-seal","Vault Seal");toast("Vault open. After midnight is awake.");save();play();
}
function midnight(){
  fadeTo(()=>{
    if(activeRoom!=="midnight")return;
    document.getElementById("box").innerHTML=`<div class="ey">AFTER MIDNIGHT</div><h2>One lock. Three beats.</h2><p class="say">The house uses what you already learned, backward.</p><div class="cipher">13 · 10 · 7 · ?</div><div class="choices"><button class="choice" onclick="mid2()">4</button><button class="choice" onclick="miss(this,'Count down by 3.')">16</button></div>`;
  });
}
function mid2(){
  document.getElementById("box").innerHTML=`<h2>Then the sky, from the end.</h2><p class="muted">Downstairs was 2, 4, 1.</p><div class="choices"><button class="choice" onclick="mid3()">1 · 4 · 2</button><button class="choice" onclick="miss(this,'Read the old order backward.')">2 · 4 · 1</button></div>`;
}
function mid3(){
  document.getElementById("box").innerHTML=`<h2>Last: the door that was a lie.</h2><div class="choices"><button class="choice" onclick="grant('night-seal','Night Seal');play()">Gold</button><button class="choice" onclick="miss(this,'Downstairs gold was the painting. Midnight keeps it.')">Blue</button></div>`;
}
function claimDaily(){
  const now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  if(S.last>=today)return toast("Already claimed today.");
  const prev=S.last?Math.round((Date.parse(today)-Date.parse(S.last))/86400000):99;
  S.streak=prev===1?Math.min(7,S.streak+1):1;S.last=today;
  const reward=2500+(S.streak-1)*250;S.cash+=reward;S.xp+=60;save();toast("Day "+S.streak+": M$"+reward);
}
function vault(){
  activeRoom="";
  show("vault");
  document.getElementById("vault").innerHTML=`<div class="panel"><div class="ey">VAULT</div><h1>M$ ${Number(S.cash||0).toLocaleString()}</h1><p class="muted">${S.starter?"Starter vault open. Buy something the house can keep.":"Still sealed. Bring four clues to the vault door."} Fictional dollars, no cash value.</p><div class="bar"><span style="width:${Math.min(100,S.xp/xpNext()*100)}%"></span></div><p class="muted">${S.xp} XP · level ${level()} · ${S.perfect||0} perfect rooms</p><div class="row"><button class="btn ghost" onclick="play()">Doors</button></div><div class="grid">${Object.entries(ASSETS).map(([id,a])=>`<article class="asset"><h3>${a.name}</h3><p class="muted">M$ ${a.price.toLocaleString()} · level ${a.level}</p><button class="btn" ${S.owned[id]?"disabled":""} onclick="buy('${id}')">${S.owned[id]?"In the house":"Buy"}</button></article>`).join("")}</div></div>`;
}
function buy(id){const a=ASSETS[id];if(!a)return;if(S.owned[id])return toast("Already in the house.");if(!S.starter)return toast("Open the vault first.");if(level()<a.level)return toast("Needs level "+a.level);if(S.cash<a.price)return toast("Not enough Mansion Dollars.");S.cash-=a.price;S.owned[id]=1;S.xp+=70;save();vault();toast(a.name+" is in the house.")}
function gallery(){document.getElementById("box").innerHTML=`<h2>Which portrait blinked?</h2><p class="muted">The eyes moved on the left. The center is varnish. The right is a mirror.</p><div class="choices"><button class="choice" onclick="grant('portrait','Living Portrait');play()">Left</button><button class="choice" onclick="miss(this,'Watch the left frame.')">Center</button><button class="choice" onclick="miss(this,'The right frame only copies you.')">Right</button></div>`}
function balcony(){document.getElementById("box").innerHTML=`<h2>The storm knocks.</h2><p class="muted">Three, then one. Answer with the same count.</p><div class="choices"><button class="choice" onclick="grant('storm','Storm Feather');play()">Four knocks</button><button class="choice" onclick="miss(this,'Three, then one. That is four.')">Three knocks</button></div>`}
function belfry(){const hour=(S.hour%12)||12;document.getElementById("box").innerHTML=`<h2>How many times did the tower just strike?</h2><p class="muted">It strikes the hour on the clock.</p><div class="choices">${[hour,hour===1?2:hour-1,12].filter((v,i,a)=>a.indexOf(v)===i).map(n=>`<button class="choice" onclick="if(${n}===${hour}){grant('bell','Tower Bell');play()}else miss(this,'Count the face. It is ${hour}.')">${n}</button>`).join("")}</div>`}
function album(){
  activeRoom="";
  show("album");
  document.getElementById("album").innerHTML=`<div class="panel"><div class="ey">ALBUM ${S.cards.length}/12</div><h1>${S.cards.length===12?"Both floors are quiet.":"Ground doors, then the upper floor."}</h1><div class="row"><button class="btn ghost" onclick="play()">Back</button></div><div class="grid">${ROOMS.concat([{card:"night-seal",label:"Night Seal",name:"After midnight"}]).map(r=>`<article class="card" style="opacity:${S.cards.includes(r.card)?1:.45}"><h3>${S.cards.includes(r.card)?r.label:"Still in the house"}</h3><p class="muted">${(r.floor?"Upper · ":"")}${r.name}</p></article>`).join("")}</div></div>`;
}
hud();home();
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{console.warn("Offline installation is unavailable; online play is still available.")})}
</script>
